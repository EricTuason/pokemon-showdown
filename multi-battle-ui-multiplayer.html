<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemon Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="battle-ui.css">
<style>
/* ── multiplayer-only styles ─────────────────────────────── */
.header-right { display:flex; align-items:center; gap:12px; }
.player-indicator {
	background:var(--accent2); color:#1a1a2e;
	padding:5px 12px; border-radius:16px;
	font-weight:700; font-size:12px;
}
.player-indicator.spectator { background:var(--overlay); color:var(--text); }

.back-btn {
	background:var(--surface2); border:1px solid var(--overlay);
	color:var(--text); padding:6px 14px; border-radius:5px;
	cursor:pointer; font-size:12px; text-decoration:none;
	display:inline-flex; align-items:center; gap:5px; font-weight:500;
}
.back-btn:hover { background:var(--overlay); }

.battle-container { max-width:900px; margin:0 auto; padding:12px; }

.winner-banner {
	background:linear-gradient(180deg,#3d7a3d,#2d6a2d);
	color:#fff; text-align:center; padding:16px;
	font-size:18px; font-weight:700;
}
.winner-banner.lost { background:linear-gradient(180deg,#8a3030,#6a2020); }
</style>
</head>
<body>

<!-- ── header ── -->
<div class="header">
	<h1>⏳ Timeline Battle</h1>
	<div class="header-right">
		<span class="player-indicator" id="playerIndicator">Loading…</span>
		<a href="/lobby" class="back-btn">← Lobby</a>
	</div>
</div>

<!-- ── timeline tree (always visible) ── -->
<div class="tree-section">
	<div class="tree-header">
		<div class="tree-label"><span>🌳</span> Timeline Tree</div>
		<div class="tree-legend">
			<div class="tree-legend-item">
				<div class="tree-legend-color" style="background:var(--accent2)"></div>
				<span>Your Battle</span>
			</div>
			<div class="tree-legend-item">
				<div class="tree-legend-color" style="border:2px dashed var(--accent);background:transparent"></div>
				<span>Branch</span>
			</div>
		</div>
	</div>
	<div class="tree-scroll">
		<div class="tree-container" id="treeContainer">
			<svg class="tree-svg" id="treeSvg"></svg>
			<div class="tree-nodes" id="treeNodes"></div>
		</div>
	</div>
</div>

<!-- ── single battle card ── -->
<div class="battle-container">
	<div class="battle-card">
		<div class="card-header">
			<div class="card-title">
				<span class="card-timeline-num" id="timelineNum">T1</span>
				<span class="card-timeline-label" id="timelineLabel">Timeline 1</span>
				<span id="branchTag"></span>
			</div>
			<div class="card-meta">
				<span class="card-coord" id="cardCoord">1-1</span>
			</div>
		</div>

		<div id="winnerBanner"></div>
		<div class="scene"    id="scene"></div>
		<div class="controls" id="controls">
			<div class="controls-disabled">Loading battle…</div>
		</div>
		<div class="battle-log" id="battleLog"></div>
	</div>
</div>

<!-- ── transfer modal (shared markup – identical to manager) ── -->
<div class="modal-bg" id="ttModal">
	<div class="modal">
		<div class="modal-hd">⏳ Time Transfer</div>
		<div class="modal-bd">
			<div class="modal-info" id="ttInfo"></div>
			<p style="color:var(--text-dim);font-size:12px;margin-bottom:14px;">
				Select a destination coordinate. A new timeline will branch from that point with your Pokémon.
			</p>
			<div id="ttTargets"></div>
		</div>
		<div class="modal-ft">
			<button class="btn-cancel" onclick="BattleUI.closeTransferModal()">Cancel</button>
			<button class="btn-confirm" id="btnConfirm" onclick="confirmTT()" disabled>
				Transfer to <span id="confirmCoord">—</span>
			</button>
		</div>
	</div>
</div>

<div class="toast" id="toast"></div>

<!-- ── scripts ── -->
<script src="battle-ui.js"></script>
<script>
// ─── URL params ───────────────────────────────────────────
const params     = new URLSearchParams(window.location.search);
const battleId   = params.get('id');
const playerSide = params.get('side');                          // 'p1' | 'p2' | null
const isSpectator = params.get('spectate') === 'true' || !playerSide;

// ─── page state ───────────────────────────────────────────
let allBattles = {};   // full map for the tree
let state      = null; // current battle (from the filtered endpoint)

// ─── fetch ────────────────────────────────────────────────
async function refresh() {
    if (!battleId) {
        document.getElementById('controls').innerHTML =
            '<div class="controls-disabled">No battle ID specified.</div>';
        return;
    }
    try {
        // current battle (server may filter log / HP for the requesting side)
        state = await (await fetch(`/api/battle-state?id=${battleId}&side=${playerSide || ''}`)).json();

        if (state.error) {
            document.getElementById('controls').innerHTML =
                `<div class="controls-disabled">${state.error}</div>`;
            return;
        }

        // full map for the tree
        const full = await BattleUI.api('state?battleId=' + battleId);
        allBattles = full.battles || {};

        render();
    } catch (e) {
        console.error('refresh failed', e);
    }
}

// ─── render ───────────────────────────────────────────────
function render() {
    if (!state) return;

    // ── player indicator ──
    const ind = document.getElementById('playerIndicator');
    if (isSpectator) {
        ind.textContent = '👁️ Spectating';
        ind.classList.add('spectator');
    } else {
        ind.textContent = `Playing as ${state.sides[playerSide]?.name || playerSide.toUpperCase()}`;
        ind.classList.remove('spectator');
    }

    // ── card header ──
    const tNum = state.timelineNum || 1;
    document.getElementById('timelineNum').textContent  = `T${tNum}`;
    document.getElementById('timelineLabel').textContent = `Timeline ${tNum}`;
    document.getElementById('cardCoord').textContent     = `${tNum}-${state.turn}`;

    const branchEl = document.getElementById('branchTag');
    branchEl.innerHTML = state.lineage
        ? `<span class="branch-tag">from ${state.lineage.fromCoord}</span>` : '';

    // ── tree (always rendered, highlights only THIS battle) ──
    BattleUI.renderTree(
        document.getElementById('treeContainer'),
        document.getElementById('treeSvg'),
        document.getElementById('treeNodes'),
        allBattles,
        battleId,                          // only this battle's current turn is highlighted
        node => {                          // clicking any other battle navigates to it
            if (node.id !== battleId) {
                const url = new URL(window.location);
                url.searchParams.set('id', node.id);
                window.location.href = url.toString();
            }
        }
    );

    // ── winner banner ──
    renderWinner();

    // ── scene ──
    BattleUI.renderScene(document.getElementById('scene'), state.sides, playerSide);

    // ── controls ──
    renderControls();

    // ── log ──
    BattleUI.renderLog(state.log, document.getElementById('battleLog'));
}

// ─── winner banner ────────────────────────────────────────
function renderWinner() {
    const banner = document.getElementById('winnerBanner');
    if (!state.ended) { banner.innerHTML = ''; return; }

    const ownName  = state.sides[playerSide]?.name;
    const isWinner = state.winner === ownName;

    if (isSpectator) {
        banner.className  = 'winner-banner';
        banner.innerHTML  = `🏆 ${state.winner || 'Draw'} wins!`;
    } else if (isWinner) {
        banner.className  = 'winner-banner';
        banner.innerHTML  = '🏆 You Win!';
    } else {
        banner.className  = 'winner-banner lost';
        banner.innerHTML  = '💀 You Lose!';
    }
}

// ─── controls ─────────────────────────────────────────────
function renderControls() {
    const ctrl = document.getElementById('controls');

    if (state.ended) {
        ctrl.innerHTML = '<div class="controls-disabled">Battle has ended.</div>';
        return;
    }
    if (isSpectator) {
        ctrl.innerHTML = '<div class="controls-disabled">👁️ Spectating – controls disabled.</div>';
        return;
    }

    const side = state.sides[playerSide];
    if (!side) {
        ctrl.innerHTML = '<div class="controls-disabled">Invalid player side.</div>';
        return;
    }

    // replace the controls div contents with the shared panel
    const panel = BattleUI.renderControlsPanel(
        battleId,
        playerSide,
        side,
        state,
        choice => submitChoice(choice),   // onSubmitChoice
        ()     => openTT(),               // onOpenTT
        true                              // isPlayer – friendlier labels
    );

    // swap inner content (keep the outer .controls element stable)
    ctrl.innerHTML = '';
    // move children from the generated panel into the existing element
    while (panel.firstChild) ctrl.appendChild(panel.firstChild);
}

// ─── choice submission ────────────────────────────────────
async function submitChoice(choice) {
    if (isSpectator) return;
    const r = await BattleUI.api('choice', { battleId, side: playerSide, choice });
    if (!r.success) BattleUI.toast(r.error, 'err');
    await refresh();
}

// ─── time-transfer modal ──────────────────────────────────
async function openTT() {
    if (isSpectator) return;
    const poke = state.sides[playerSide]?.active?.[0];
    if (!poke) return;
    await BattleUI.populateTransferModal(poke, state.timelineNum || 1, state.turn, battleId);
}

async function confirmTT() {
    const target = BattleUI.getTransferTarget();
    if (!target) return;

    const r = await BattleUI.api('queue-transfer', {
        battleId,
        side             : playerSide,
        targetTimelineId : target.timelineId,
        targetTurn       : target.turn,
    });

    BattleUI.closeTransferModal();

    if (r.success) BattleUI.toast(`${r.pokemonName} queued → ${r.targetCoord}`, 'info');
    else           BattleUI.toast(r.error, 'err');

    await refresh();
}

// ─── init ─────────────────────────────────────────────────
if (!battleId) {
    document.getElementById('controls').innerHTML =
        '<div class="controls-disabled">No battle ID. <a href="/lobby" style="color:var(--accent2)">Go to Lobby</a></div>';
} else {
    setInterval(refresh, 1000);
    refresh();
}
</script>
</body>
</html>
