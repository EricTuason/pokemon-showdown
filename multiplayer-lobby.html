<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemon Battle Lobby</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #1a1a2e;
    --surface: #252540;
    --surface2: #353560;
    --overlay: #4a4a70;
    --text: #e0e0f0;
    --text-dim: #9090b0;
    --accent: #b090ff;
    --accent2: #70d0e0;
    --accent3: #f0d070;
    --red: #ff7088;
    --green: #70e080;
    --blue: #70a0ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Roboto', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.lobby-container {
    background: var(--surface);
    border-radius: 12px;
    border: 2px solid var(--surface2);
    padding: 30px;
    max-width: 500px;
    width: 100%;
}

h1 {
    color: var(--accent);
    font-size: 24px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 24px;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 14px;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.battle-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
}

.battle-item {
    background: var(--surface2);
    border: 2px solid var(--overlay);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s;
}

.battle-item:hover {
    border-color: var(--accent);
    transform: translateX(4px);
}

.battle-item.selected {
    border-color: var(--accent2);
    background: rgba(112, 208, 224, 0.1);
}

.battle-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.battle-id {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    color: var(--accent3);
}

.battle-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
}

.battle-status.active {
    background: var(--green);
    color: #1a1a2e;
}

.battle-status.ended {
    background: var(--red);
    color: #fff;
}

.battle-status.waiting {
    background: var(--accent3);
    color: #1a1a2e;
}

.battle-players {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.player-slot {
    display: flex;
    align-items: center;
    gap: 6px;
}

.player-slot.available {
    color: var(--green);
}

.player-slot.taken {
    color: var(--text-dim);
}

.vs {
    color: var(--overlay);
    font-weight: 700;
}

.join-section {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--overlay);
}

.player-select {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.player-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--overlay);
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
}

.player-btn:hover:not(:disabled) {
    border-color: var(--accent);
}

.player-btn.selected {
    border-color: var(--accent2);
    background: rgba(112, 208, 224, 0.15);
}

.player-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.player-btn .player-name {
    display: block;
    font-size: 16px;
    margin-bottom: 4px;
}

.player-btn .player-team {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
}

.join-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(180deg, #5a9a5a, #3d7a3d);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
}

.join-btn:hover:not(:disabled) {
    filter: brightness(1.15);
    transform: translateY(-2px);
}

.join-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.spectate-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface2);
    border: 1px solid var(--overlay);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    margin-top: 8px;
}

.spectate-btn:hover {
    background: var(--overlay);
    color: var(--text);
}

.create-section {
    background: var(--surface2);
    border-radius: 8px;
    padding: 16px;
}

.form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

.form-group {
    flex: 1;
}

.form-group label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--overlay);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
}

.form-group select option {
    background: var(--surface);
}

.create-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(180deg, #7a5aad, #5c3d8a);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
}

.create-btn:hover {
    filter: brightness(1.15);
}

.no-battles {
    text-align: center;
    color: var(--text-dim);
    padding: 20px;
    font-style: italic;
}

.refresh-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 16px;
}

.error {
    background: rgba(255, 112, 136, 0.2);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
}

.current-session {
    background: rgba(112, 208, 224, 0.1);
    border: 2px solid var(--accent2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
}

.current-session h3 {
    color: var(--accent2);
    font-size: 14px;
    margin-bottom: 8px;
}

.session-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.session-details {
    font-size: 13px;
}

.session-details .battle-name {
    font-weight: 700;
    color: var(--accent3);
}

.leave-btn {
    padding: 8px 16px;
    background: var(--red);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.leave-btn:hover {
    filter: brightness(1.15);
}

.rejoin-btn {
    padding: 8px 16px;
    background: var(--green);
    border: none;
    border-radius: 6px;
    color: #1a1a2e;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
}

.rejoin-btn:hover {
    filter: brightness(1.15);
}
</style>
</head>
<body>

<div class="lobby-container">
    <h1>⚔️ Pokemon Battle Lobby</h1>
    <p class="subtitle">Join an existing battle or create a new one</p>

    <div id="errorMsg" class="error" style="display: none;"></div>

    <div id="currentSession" class="current-session" style="display: none;">
        <h3>📍 Current Session</h3>
        <div class="session-info">
            <div class="session-details">
                <span class="battle-name" id="sessionBattle"></span> as 
                <strong id="sessionPlayer"></strong>
            </div>
            <div>
                <button class="rejoin-btn" onclick="rejoinBattle()">Continue</button>
                <button class="leave-btn" onclick="leaveSession()">Leave</button>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🎮 Active Battles</div>
        <div class="battle-list" id="battleList">
            <div class="no-battles">Loading...</div>
        </div>

        <div class="join-section" id="joinSection" style="display: none;">
            <div class="player-select" id="playerSelect"></div>
            <button class="join-btn" id="joinBtn" onclick="joinBattle()" disabled>
                Select a Player Slot
            </button>
            <button class="spectate-btn" onclick="spectate()">
                👁️ Spectate (View Only)
            </button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">✨ Create New Battle</div>
        <div class="create-section">
            <div class="form-row">
                <div class="form-group">
                    <label>Player 1 Name</label>
                    <input type="text" id="p1Name" value="Red" />
                </div>
                <div class="form-group">
                    <label>Player 1 Team</label>
                    <select id="p1Team">
                        <option value="electric">Electric</option>
                        <option value="fire">Fire</option>
                        <option value="grass">Grass</option>
                        <option value="water">Water</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Player 2 Name</label>
                    <input type="text" id="p2Name" value="Blue" />
                </div>
                <div class="form-group">
                    <label>Player 2 Team</label>
                    <select id="p2Team">
                        <option value="grass">Grass</option>
                        <option value="water">Water</option>
                        <option value="fire">Fire</option>
                        <option value="electric">Electric</option>
                    </select>
                </div>
            </div>
            <button class="create-btn" onclick="createBattle()">
                Create Battle
            </button>
        </div>
    </div>

    <p class="refresh-note">Auto-refreshes every 2 seconds</p>
</div>

<script>
// Session storage keys
const SESSION_KEY = 'pokemon_battle_session';

let state = { battles: {} };
let selectedBattle = null;
let selectedSide = null;

// Load saved session
function getSession() {
    try {
        const saved = localStorage.getItem(SESSION_KEY);
        return saved ? JSON.parse(saved) : null;
    } catch {
        return null;
    }
}

function saveSession(battleId, side, playerName) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
        battleId,
        side,
        playerName,
        timestamp: Date.now()
    }));
}

function clearSession() {
    localStorage.removeItem(SESSION_KEY);
}

// API calls
async function api(path, body) {
    const opts = body ? {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    } : {};
    return (await fetch('/api/' + path, opts)).json();
}

async function refresh() {
    try {
        state = await api('state');
        renderBattleList();
        checkCurrentSession();
    } catch (e) {
        showError('Failed to connect to server');
    }
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function checkCurrentSession() {
    const session = getSession();
    const sessionDiv = document.getElementById('currentSession');
    
    if (session && state.battles[session.battleId]) {
        const battle = state.battles[session.battleId];
        if (!battle.ended) {
            document.getElementById('sessionBattle').textContent = 
                `Timeline ${battle.timelineNum}`;
            document.getElementById('sessionPlayer').textContent = 
                `${session.side.toUpperCase()} (${session.playerName})`;
            sessionDiv.style.display = 'block';
            return;
        }
    }
    
    sessionDiv.style.display = 'none';
    if (session && !state.battles[session.battleId]) {
        clearSession();
    }
}

function renderBattleList() {
    const list = document.getElementById('battleList');
    const battles = Object.entries(state.battles)
        .filter(([_, b]) => !b.ended)
        .sort((a, b) => (a[1].timelineNum || 1) - (b[1].timelineNum || 1));

    if (battles.length === 0) {
        list.innerHTML = '<div class="no-battles">No active battles. Create one below!</div>';
        document.getElementById('joinSection').style.display = 'none';
        return;
    }

    list.innerHTML = battles.map(([id, b]) => {
        const p1 = b.sides.p1;
        const p2 = b.sides.p2;
        const isSelected = selectedBattle === id;
        
        let status = 'active';
        let statusText = 'In Progress';
        
        if (b.requestState === 'move') {
            const p1Done = b.sides.p1?.choiceDone;
            const p2Done = b.sides.p2?.choiceDone;
            if (!p1Done || !p2Done) {
                status = 'waiting';
                statusText = 'Waiting for moves';
            }
        }

        return `
            <div class="battle-item ${isSelected ? 'selected' : ''}" 
                 onclick="selectBattle('${id}')">
                <div class="battle-header">
                    <span class="battle-id">Timeline ${b.timelineNum} (Turn ${b.turn})</span>
                    <span class="battle-status ${status}">${statusText}</span>
                </div>
                <div class="battle-players">
                    <span class="player-slot">${p1?.name || 'Player 1'}</span>
                    <span class="vs">VS</span>
                    <span class="player-slot">${p2?.name || 'Player 2'}</span>
                </div>
            </div>
        `;
    }).join('');

    if (selectedBattle && state.battles[selectedBattle]) {
        updateJoinSection();
    }
}

function selectBattle(id) {
    selectedBattle = id;
    selectedSide = null;
    renderBattleList();
    updateJoinSection();
}

function updateJoinSection() {
    const section = document.getElementById('joinSection');
    const select = document.getElementById('playerSelect');
    const btn = document.getElementById('joinBtn');

    if (!selectedBattle || !state.battles[selectedBattle]) {
        section.style.display = 'none';
        return;
    }

    const battle = state.battles[selectedBattle];
    const session = getSession();

    section.style.display = 'block';

    // Check which slots are available (in a real implementation, 
    // you'd track connected players server-side)
    const p1 = battle.sides.p1;
    const p2 = battle.sides.p2;

    select.innerHTML = `
        <button class="player-btn ${selectedSide === 'p1' ? 'selected' : ''}" 
                onclick="selectSide('p1')">
            <span class="player-name">P1: ${p1?.name || 'Player 1'}</span>
            <span class="player-team">${p1?.active[0]?.species || 'Unknown'}</span>
        </button>
        <button class="player-btn ${selectedSide === 'p2' ? 'selected' : ''}"
                onclick="selectSide('p2')">
            <span class="player-name">P2: ${p2?.name || 'Player 2'}</span>
            <span class="player-team">${p2?.active[0]?.species || 'Unknown'}</span>
        </button>
    `;

    if (selectedSide) {
        const playerName = battle.sides[selectedSide]?.name || selectedSide.toUpperCase();
        btn.textContent = `Join as ${playerName}`;
        btn.disabled = false;
    } else {
        btn.textContent = 'Select a Player Slot';
        btn.disabled = true;
    }
}

function selectSide(side) {
    selectedSide = side;
    updateJoinSection();
}

function joinBattle() {
    if (!selectedBattle || !selectedSide) return;

    const battle = state.battles[selectedBattle];
    const playerName = battle.sides[selectedSide]?.name || selectedSide.toUpperCase();

    saveSession(selectedBattle, selectedSide, playerName);

    // Navigate to the battle UI with player context
    window.location.href = `/battle?id=${selectedBattle}&side=${selectedSide}`;
}

function spectate() {
    if (!selectedBattle) return;
    window.location.href = `/battle?id=${selectedBattle}&spectate=true`;
}

function rejoinBattle() {
    const session = getSession();
    if (session) {
        window.location.href = `/battle?id=${session.battleId}&side=${session.side}`;
    }
}

function leaveSession() {
    clearSession();
    checkCurrentSession();
}

async function createBattle() {
    const data = {
        p1Name: document.getElementById('p1Name').value || 'Player 1',
        p1Team: document.getElementById('p1Team').value,
        p2Name: document.getElementById('p2Name').value || 'Player 2',
        p2Team: document.getElementById('p2Team').value
    };

    try {
        const result = await api('create', data);
        if (result.success) {
            await refresh();
            selectBattle(result.id);
        } else {
            showError(result.error || 'Failed to create battle');
        }
    } catch (e) {
        showError('Failed to create battle');
    }
}

// Auto-refresh
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
