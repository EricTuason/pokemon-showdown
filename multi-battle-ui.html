<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Battle Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="battle-ui.css">
<style>
/* ── manager-only styles ──────────────────────────────────── */
.battles-grid {
	display:flex; flex-wrap:wrap; gap:12px; padding:12px;
}
.battle-card { flex:1; min-width:480px; max-width:680px; }

/* Create panel */
.create-panel {
	display:none; background:var(--surface); border-radius:8px;
	border:1px solid var(--overlay); padding:16px; margin:8px 12px 0; max-width:420px;
}
.create-panel.open{display:block;}
.create-panel h3{color:var(--accent3);margin-bottom:10px;font-size:15px;}
.form-row{display:flex;gap:10px;margin-bottom:8px;}
.form-g{flex:1;}
.form-g label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:3px;}
.form-g input,.form-g select{
	width:100%;padding:6px 10px;border:1px solid var(--overlay);border-radius:4px;
	background:var(--surface2);color:var(--text);font-size:13px;
}
.form-g select option{background:var(--surface2);}
.btn-create{background:linear-gradient(180deg,#5a8ab5,#3d6a8a);border:none;color:#fff;
	padding:8px 20px;border-radius:5px;cursor:pointer;font-weight:600;margin-top:6px;}
.btn-create:hover{filter:brightness(1.15);}
</style>
</head>
<body>

<!-- ── header ── -->
<div class="header">
	<h1>⏳ Timeline Battle Manager</h1>
	<div class="header-btns">
		<button class="hbtn" onclick="toggleCreate()">+ New Timeline</button>
		<button class="hbtn" onclick="refresh()">↻ Refresh</button>
	</div>
</div>

<!-- ── timeline tree ── -->
<div class="tree-section">
	<div class="tree-header">
		<div class="tree-label"><span>🌳</span> Timeline Tree</div>
		<div class="tree-legend">
			<div class="tree-legend-item">
				<div class="tree-legend-color" style="background:var(--accent2)"></div>
				<span>Current Turn</span>
			</div>
			<div class="tree-legend-item">
				<div class="tree-legend-color" style="border:2px dashed var(--accent);background:transparent"></div>
				<span>Branch</span>
			</div>
		</div>
	</div>
	<div class="tree-scroll">
		<div class="tree-container" id="treeContainer">
			<svg class="tree-svg" id="treeSvg"></svg>
			<div class="tree-nodes" id="treeNodes"></div>
		</div>
	</div>
</div>

<!-- ── new-timeline form ── -->
<div class="create-panel" id="createPanel">
	<h3>New Timeline (Fresh Battle)</h3>
	<div class="form-row">
		<div class="form-g"><label>P1 Name</label><input id="fP1N" value="Ash"/></div>
		<div class="form-g"><label>P1 Team</label>
			<select id="fP1T">
				<option value="fire">Fire</option><option value="electric">Electric</option>
				<option value="grass">Grass</option><option value="water">Water</option>
			</select></div>
	</div>
	<div class="form-row">
		<div class="form-g"><label>P2 Name</label><input id="fP2N" value="Gary"/></div>
		<div class="form-g"><label>P2 Team</label>
			<select id="fP2T">
				<option value="water">Water</option><option value="grass">Grass</option>
				<option value="electric">Electric</option><option value="fire">Fire</option>
			</select></div>
	</div>
	<button class="btn-create" onclick="createBattle()">Create Timeline</button>
</div>

<!-- ── battle cards ── -->
<div class="battles-grid" id="battlesGrid"></div>

<!-- ── transfer modal (shared markup) ── -->
<div class="modal-bg" id="ttModal">
	<div class="modal">
		<div class="modal-hd">⏳ Time Transfer</div>
		<div class="modal-bd">
			<div class="modal-info" id="ttInfo"></div>
			<p style="color:var(--text-dim);font-size:12px;margin-bottom:14px;">
				Select a destination coordinate. A new timeline will branch from that point with your Pokémon.
			</p>
			<div id="ttTargets"></div>
		</div>
		<div class="modal-ft">
			<button class="btn-cancel" onclick="BattleUI.closeTransferModal()">Cancel</button>
			<button class="btn-confirm" id="btnConfirm" onclick="confirmTT()" disabled>
				Transfer to <span id="confirmCoord">—</span>
			</button>
		</div>
	</div>
</div>

<div class="toast" id="toast"></div>

<!-- ── scripts ── -->
<script src="battle-ui.js"></script>
<script>
// ─── page state ───────────────────────────────────────────
let state = { battles: {} };

// ttSource is set by openTT() so that confirmTT() knows which
// battle / side the transfer originates from.
let ttSource = null;

// ─── data ─────────────────────────────────────────────────
async function refresh() {
    state = await BattleUI.api('state');
    render();
}

// ─── create ───────────────────────────────────────────────
async function createBattle() {
    const r = await BattleUI.api('create', {
        p1Name: document.getElementById('fP1N').value,
        p1Team: document.getElementById('fP1T').value,
        p2Name: document.getElementById('fP2N').value,
        p2Team: document.getElementById('fP2T').value,
    });
    if (r.success) {
        BattleUI.toast(`Timeline created: ${r.id}`, 'ok');
        document.getElementById('createPanel').classList.remove('open');
    } else {
        BattleUI.toast(r.error, 'err');
    }
    await refresh();
}
function toggleCreate() {
    document.getElementById('createPanel').classList.toggle('open');
}

// ─── render ───────────────────────────────────────────────
function render() {
    // tree – every battle's own current turn is highlighted (no single currentBattleId)
    BattleUI.renderTree(
        document.getElementById('treeContainer'),
        document.getElementById('treeSvg'),
        document.getElementById('treeNodes'),
        state.battles,
        null   // highlight each battle's current turn
    );

    // battle cards
    const grid = document.getElementById('battlesGrid');
    grid.innerHTML = '';

    Object.keys(state.battles)
        .sort((a,b) => (state.battles[a].timelineNum||1) - (state.battles[b].timelineNum||1))
        .forEach(id => grid.appendChild(renderCard(id, state.battles[id])));
}

function renderCard(id, b) {
    const card        = document.createElement('div');
    card.className    = 'battle-card';

    const timelineNum = b.timelineNum || 1;
    const coord       = b.currentCoord || `${timelineNum}-${b.turn}`;
    const branchTag   = b.lineage ? `<span class="branch-tag">from ${b.lineage.fromCoord}</span>` : '';

    // pending-transfer badges
    let pendBadges = '';
    if (b.pendingTransfers) {
        for (const s of ['p1','p2']) {
            if (b.pendingTransfers[s])
                pendBadges += `<span class="badge queued" style="margin-left:6px">
                    ${s.toUpperCase()} → ${b.pendingTransfers[s].targetCoord}</span>`;
        }
    }

    const statusText = b.ended ? (b.winner ? `Winner: ${b.winner}` : 'Ended') : '';

    card.innerHTML = `
        <div class="card-header">
            <div class="card-title">
                <span class="card-timeline-num">T${timelineNum}</span>
                <span class="card-timeline-label">Timeline ${timelineNum}</span>
                ${branchTag}
            </div>
            <div class="card-meta">
                ${statusText ? `<span style="color:var(--accent3)">${statusText}</span>` : ''}
                <span class="card-coord">${coord}</span>
                ${pendBadges}
            </div>
        </div>`;

    // scene
    const scene = document.createElement('div');
    scene.className = 'scene';
    BattleUI.renderScene(scene, b.sides, null); // no single player highlight
    card.appendChild(scene);

    // controls – one panel per side
    for (const sid of ['p1','p2']) {
        const s = b.sides[sid];
        if (!s) continue;
        card.appendChild(
            BattleUI.renderControlsPanel(
                id, sid, s, b,
                choice  => submitChoice(id, sid, choice),
                ()      => openTT(id, sid, s.active?.[0], b),
                false   // not a single-player view
            )
        );
    }

    // log
    const logDiv = document.createElement('div');
    logDiv.className = 'battle-log';
    BattleUI.renderLog(b.log, logDiv);
    card.appendChild(logDiv);

    return card;
}

// ─── choice submission ────────────────────────────────────
async function submitChoice(bid, sid, choice) {
    const r = await BattleUI.api('choice', { battleId: bid, side: sid, choice });
    if (!r.success) BattleUI.toast(r.error, 'err');
    await refresh();
}

// ─── time-transfer modal ──────────────────────────────────
async function openTT(bid, sid, poke, battle) {
    if (!poke) return;
    ttSource = { battleId: bid, side: sid };
    await BattleUI.populateTransferModal(poke, battle.timelineNum || 1, battle.turn, bid);
}

async function confirmTT() {
    const target = BattleUI.getTransferTarget();
    if (!ttSource || !target) return;

    const r = await BattleUI.api('queue-transfer', {
        battleId           : ttSource.battleId,
        side               : ttSource.side,
        targetTimelineId   : target.timelineId,
        targetTurn         : target.turn,
    });

    BattleUI.closeTransferModal();
    ttSource = null;

    if (r.success) BattleUI.toast(`${r.pokemonName} queued → ${r.targetCoord}`, 'info');
    else           BattleUI.toast(r.error, 'err');

    await refresh();
}

// ─── init ─────────────────────────────────────────────────
setInterval(refresh, 1200);
refresh();
</script>
</body>
</html>
